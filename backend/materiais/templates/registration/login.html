{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
</head>

<body>
    <div class="login-box">
        <picture>
            <source media="(max-width:600px )" srcset="{% static 'img/logo_login.png' %}" type="image/png">
            <img src="{% static 'img/login_ambipar.png' %}" alt="Logo Ambipar">
        </picture>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
